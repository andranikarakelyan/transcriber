appId: com.transcriber.desktop
productName: Transcriber Desktop
copyright: Copyright © 2026 Transcriber Team
directories:
  output: dist
  buildResources: resources
files:
  - from: .
    filter:
      - package.json
      - app
extraResources:
  - from: main/transcribe.py
    to: transcribe.py
  # Bundled portable Python environment (created by: pnpm setup:python)
  # Contains: Python 3.12, openai-whisper, torch-cpu
  # GPU packages (DirectML/CUDA) are installed here by the in-app setup wizard
  - from: resources/python
    to: python
    filter:
      - "**/*"
publish: null
win:
  icon: resources/icon.ico
  target:
    - nsis
nsis:
  installerIcon: resources/icon.ico
  uninstallerIcon: resources/icon.ico
mac:
  icon: resources/icon.svg
  category: public.app-category.utilities
linux:
  icon: resources/icon.svg
  category: Utility
