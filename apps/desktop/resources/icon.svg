<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f1f3d"/>
      <stop offset="100%" stop-color="#1a1040"/>
    </linearGradient>
    <linearGradient id="bar1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="bar2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="bar3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background rounded square -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>

  <!-- Waveform bars (5 bars, centered) -->
  <!-- Bar widths: 44px each, gaps: 23px, total = 5*44+4*23 = 312, start = (512-312)/2 = 100 -->
  <g filter="url(#glow)">
    <!-- Bar 1 (short) -->
    <rect x="100" y="179" width="44" height="154" rx="22" fill="url(#bar1)" opacity="0.9"/>
    <!-- Bar 2 (medium) -->
    <rect x="167" y="122" width="44" height="268" rx="22" fill="url(#bar2)" opacity="0.95"/>
    <!-- Bar 3 (tall) -->
    <rect x="234" y="72"  width="44" height="368" rx="22" fill="url(#bar3)"/>
    <!-- Bar 4 (medium) -->
    <rect x="301" y="122" width="44" height="268" rx="22" fill="url(#bar2)" opacity="0.95"/>
    <!-- Bar 5 (short) -->
    <rect x="368" y="179" width="44" height="154" rx="22" fill="url(#bar1)" opacity="0.9"/>
  </g>
</svg>
