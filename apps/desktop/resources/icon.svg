<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="256" cy="256" r="240" fill="#2563eb"/>
  
  <!-- Microphone -->
  <g transform="translate(140, 120)">
    <!-- Microphone body -->
    <rect x="65" y="40" width="60" height="100" rx="30" fill="#ffffff"/>
    
    <!-- Microphone stand -->
    <path d="M 95 140 Q 95 180 95 180" stroke="#ffffff" stroke-width="8" fill="none" stroke-linecap="round"/>
    <path d="M 70 180 L 120 180" stroke="#ffffff" stroke-width="8" fill="none" stroke-linecap="round"/>
    
    <!-- Microphone arc (sound waves) -->
    <path d="M 45 90 Q 30 90 30 110 Q 30 130 45 130" stroke="#ffffff" stroke-width="6" fill="none" stroke-linecap="round"/>
    <path d="M 145 90 Q 160 90 160 110 Q 160 130 145 130" stroke="#ffffff" stroke-width="6" fill="none" stroke-linecap="round"/>
  </g>
  
  <!-- Text/Document lines -->
  <g transform="translate(240, 200)">
    <rect x="10" y="0" width="100" height="130" rx="8" fill="#ffffff" opacity="0.95"/>
    <line x1="25" y1="25" x2="95" y2="25" stroke="#2563eb" stroke-width="4" stroke-linecap="round"/>
    <line x1="25" y1="45" x2="95" y2="45" stroke="#2563eb" stroke-width="4" stroke-linecap="round"/>
    <line x1="25" y1="65" x2="95" y2="65" stroke="#2563eb" stroke-width="4" stroke-linecap="round"/>
    <line x1="25" y1="85" x2="80" y2="85" stroke="#2563eb" stroke-width="4" stroke-linecap="round"/>
    <line x1="25" y1="105" x2="95" y2="105" stroke="#2563eb" stroke-width="4" stroke-linecap="round"/>
  </g>
  
  <!-- Arrow connecting microphone to document -->
  <g transform="translate(220, 260)">
    <path d="M 0 0 L 15 0" stroke="#ffffff" stroke-width="6" fill="none" stroke-linecap="round"/>
    <path d="M 12 -5 L 15 0 L 12 5" stroke="#ffffff" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  
  <!-- Decorative sound waves -->
  <g opacity="0.6">
    <path d="M 140 200 Q 120 200 120 230 Q 120 260 140 260" stroke="#ffffff" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M 125 215 Q 110 215 110 230 Q 110 245 125 245" stroke="#ffffff" stroke-width="4" fill="none" stroke-linecap="round"/>
  </g>
</svg>
